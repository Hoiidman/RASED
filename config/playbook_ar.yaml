# Arabic text of playbook.yaml (same rules, same order), shown when the dashboard is in Arabic.
off_forecast:
  - التحقق من اكتمال البيانات المبلغ عنها قبل أي إجراء على مستوى السياسات.
  - الطلب من فريق القطاع مراجعة التسجيلات مقارنة بخط الأساس.
unusual_change:
  - التحقق من المقارنة السنوية ودراسة الفئة المتأثرة.
  - متابعة الشهر المكتمل التالي قبل استخلاص النتائج.
mix_shift:
  - مراجعة التغيرات في تفضيلات تأسيس الأعمال ونتائج التجديد.
  - مقارنة فئات المكاتب الافتراضية والفعلية قبل النظر في أي حوافز.
renewal_pressure:
  - مراجعة رسائل التذكير الموجهة بالتجديد وخيارات تقسيط الرسوم.
  - متابعة التجديدات ونسب عدم التجديد في الفئة المتأثرة.
data_quality:
  - مراجعة هيكل بيانات المصدر وتغطية الإبلاغ، مع الاحتفاظ بآخر نسخة سليمة.
